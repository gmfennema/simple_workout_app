<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Generator — Doodle Style</title>
  <meta name="description" content="A playful, hand-drawn workout generator to track your lifts and progress." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Delius+Swash+Caps&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    /* ── Doodle Design Tokens ── */
    :root {
      --primary: #C4923E;
      --primary-light: #e8d5b0;
      --secondary: #2C2C2C;
      --success: #2D8A4E;
      --warning: #D97706;
      --danger: #C53030;
      --surface: #FFFFFF;
      --text: #2C2C2C;
      --muted: #71706e;
      --bg: #E8E4DE;
      --border: #c5bfb6;
      --accent-soft: #f0ece6;
      --radius: 18px;
      --font-primary: 'Delius Swash Caps', cursive;
      --font-mono: 'JetBrains Mono', monospace;
      --shadow-sketch: 3px 3px 0px rgba(44, 44, 44, 0.15);
      --shadow-hover: 4px 4px 0px rgba(44, 44, 44, 0.22);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-primary);
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* ── Doodle background pattern ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle, var(--primary-light) 1px, transparent 1px),
        radial-gradient(circle, var(--border) 0.5px, transparent 0.5px);
      background-size: 40px 40px, 20px 20px;
      background-position: 0 0, 10px 10px;
      opacity: 0.2;
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    /* ── Header ── */
    header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      font-family: var(--font-primary);
      font-size: 2.2rem;
      color: var(--secondary);
      margin-bottom: 8px;
      position: relative;
      display: inline-block;
    }

    h1::after {
      content: '';
      position: absolute;
      left: -8px;
      right: -8px;
      bottom: -2px;
      height: 4px;
      background: var(--primary);
      border-radius: 4px;
      transform: rotate(-0.8deg);
    }

    h2 {
      font-family: var(--font-primary);
      font-size: 1.3rem;
      color: var(--secondary);
      margin-bottom: 12px;
    }

    h3 {
      font-family: var(--font-primary);
      font-size: 1.1rem;
      color: var(--secondary);
      margin-bottom: 4px;
    }

    .muted {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .last {
      color: var(--muted);
      font-size: 0.88rem;
      font-style: italic;
      margin-top: 4px;
    }

    /* ── Cards with sketch border ── */
    .card {
      background: var(--surface);
      border: 2.5px solid var(--secondary);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-sketch);
      margin-bottom: 16px;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -3px; left: -3px; right: -3px; bottom: -3px;
      border: 1.5px dashed var(--primary);
      border-radius: 22px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .card:hover::before { opacity: 0.5; }

    .workout-grid {
      display: grid;
      gap: 12px;
    }

    /* ── Buttons ── */
    button {
      font-family: var(--font-primary);
      border: 2.5px solid var(--primary);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 400;
      cursor: pointer;
      background: var(--primary);
      color: var(--bg);
      min-height: 48px;
      box-shadow: var(--shadow-sketch);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
      position: relative;
    }

    button:hover:not(:disabled) {
      transform: translate(-1px, -1px);
      box-shadow: var(--shadow-hover);
    }

    button:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px rgba(0, 0, 0, 0.3);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 3px;
    }

    button.secondary {
      background: var(--accent-soft);
      color: var(--secondary);
      border-color: var(--border);
    }

    button.ghost {
      background: transparent;
      color: var(--secondary);
      border: 2px dashed var(--border);
      box-shadow: none;
    }

    button.ghost:hover:not(:disabled) {
      background: var(--accent-soft);
      border-color: var(--primary);
    }

    button.danger {
      background: #f9e5e5;
      color: var(--danger);
      border-color: var(--danger);
      box-shadow: 2px 2px 0px rgba(197, 48, 48, 0.12);
    }

    button.danger:hover:not(:disabled) {
      background: #f0cece;
    }

    .choice-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    /* ── Exercise Cards ── */
    .exercise-card { padding: 16px; }

    .block-label {
      font-family: var(--font-primary);
      font-size: 0.82rem;
      text-transform: uppercase;
      color: var(--primary);
      font-weight: 400;
      letter-spacing: 0.1em;
      margin: 24px 0 8px;
      position: relative;
      padding-left: 20px;
    }

    .block-label::before {
      content: '✦';
      position: absolute;
      left: 0;
      font-size: 0.9rem;
    }

    .prescription {
      font-family: var(--font-mono);
      font-size: 1.15rem;
      font-weight: 700;
      margin-top: 10px;
      color: var(--secondary);
      background: var(--accent-soft);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px dashed var(--border);
      display: inline-block;
    }

    .note {
      background: var(--accent-soft);
      border: 1.5px dashed var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* ── Sets / Inputs ── */
    .sets {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .set-row {
      display: grid;
      grid-template-columns: 52px 1fr 1fr;
      gap: 8px;
      align-items: center;
    }

    label {
      font-family: var(--font-primary);
      font-weight: 400;
      color: var(--muted);
      font-size: 0.9rem;
    }

    input {
      font-family: var(--font-mono);
      width: 100%;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.95rem;
      background: #faf8f5;
      color: var(--text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(196, 146, 62, 0.25);
    }

    /* ── Top Bar ── */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .topbar button {
      min-height: auto;
      padding: 9px 14px;
      font-size: 0.9rem;
    }

    .hidden { display: none; }

    /* ── Summary / Finish ── */
    .summary-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .summary-item {
      background: var(--accent-soft);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.15);
    }

    .summary-item strong {
      color: var(--secondary);
    }

    .footer-actions {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    /* ── Doodle decorative squiggles ── */
    .doodle-divider {
      text-align: center;
      margin: 16px 0;
      color: var(--primary-light);
      font-size: 1.2rem;
      letter-spacing: 0.3em;
      user-select: none;
    }

    /* ── Saved state animation ── */
    @keyframes checkmark-pop {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }

    .saved-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e0f5e5;
      color: var(--success);
      border: 2px solid var(--success);
      border-radius: 10px;
      padding: 6px 12px;
      margin-top: 12px;
      font-size: 0.9rem;
      animation: checkmark-pop 0.35s ease forwards;
    }

    .saved-badge i {
      font-size: 1.1rem;
    }

    /* ── Icon helpers ── */
    .btn-icon {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    .btn-icon i {
      font-size: 1.2em;
    }

    .exercise-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .exercise-title i {
      color: var(--primary);
      font-size: 1.2rem;
    }

    /* ── Responsive ── */
    @media (min-width: 640px) {
      .workout-grid { grid-template-columns: repeat(3, 1fr); }
      .footer-actions { grid-template-columns: 1fr 1fr; }
    }

    /* ── Card entrance animation ── */
    @keyframes card-enter {
      from { opacity: 0; transform: translateY(12px) rotate(-0.5deg); }
      to { opacity: 1; transform: translateY(0) rotate(0deg); }
    }

    .card { animation: card-enter 0.35s ease forwards; }

    .exercise-card:nth-child(odd) {
      transform: rotate(-0.3deg);
    }

    .exercise-card:nth-child(even) {
      transform: rotate(0.3deg);
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1><i class="ph-thin ph-barbell" style="vertical-align: middle; margin-right: 4px;"></i> Workout Generator</h1>
      <p class="muted">Pick a workout, follow the prescription, then choose Move Up or Maintain for each exercise.</p>
    </header>

    <section id="homeScreen">
      <div class="card">
        <h2>Choose today's workout</h2>
        <div class="workout-grid" id="workoutButtons"></div>
      </div>
      <div class="doodle-divider">~ ~ ~ ~ ~</div>
      <button class="danger btn-icon" id="resetDataBtn"><i class="ph-thin ph-trash"></i> Reset all saved data</button>
    </section>

    <section id="workoutScreen" class="hidden">
      <div class="topbar">
        <button class="ghost btn-icon" id="backBtn"><i class="ph-thin ph-arrow-left"></i> Back</button>
      </div>
      <div id="workoutContent"></div>
    </section>

    <section id="finishScreen" class="hidden">
      <div class="card">
        <h2><i class="ph-thin ph-check-circle" style="color: var(--success); vertical-align: middle;"></i> Workout saved</h2>
        <p class="muted">Your next prescriptions have been updated on this device.</p>
        <div class="summary-list" id="finishSummary"></div>
        <div class="footer-actions">
          <button class="btn-icon" id="homeBtn"><i class="ph-thin ph-house"></i> Back home</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "workoutGeneratorMvp.v1";

    const EXERCISES = {
      bench_press: { name: "Bench Press", sets: 3, min: 5, max: 8, increment: 5, type: "load" },
      squat: { name: "Squat", sets: 3, min: 5, max: 8, increment: 10, type: "load" },
      deadlift: { name: "Deadlift", sets: 3, min: 5, max: 8, increment: 10, type: "load" },

      incline_db_press: { name: "Incline DB Press", sets: 3, min: 8, max: 12, increment: 5, type: "load" },
      one_arm_db_row: { name: "One-Arm DB Row", sets: 3, min: 8, max: 12, increment: 5, type: "load" },
      lateral_raise: { name: "Lateral Raise", sets: 3, min: 10, max: 15, increment: 2.5, type: "load" },
      cable_tricep_pushdown: { name: "Cable Tricep Pushdown", sets: 3, min: 10, max: 15, increment: 5, type: "load" },

      good_morning: { name: "Good Morning", sets: 3, min: 8, max: 12, increment: 5, type: "load" },
      cable_crunch: { name: "Cable Crunch", sets: 3, min: 10, max: 15, increment: 5, type: "load" },
      standing_calf_raise: { name: "Standing Calf Raise", sets: 3, min: 10, max: 15, increment: 5, type: "load" },

      pull_up: { name: "Pull-Up", sets: 3, min: 5, max: 8, increment: 0, type: "setup", setupLabel: "Band / setup" },
      band_face_pull: { name: "Band Face Pull", sets: 3, min: 10, max: 15, increment: 0, type: "setup", setupLabel: "Band / setup" },
      db_shrug: { name: "DB Shrug", sets: 3, min: 8, max: 12, increment: 5, type: "load" },
      db_bicep_curl: { name: "DB Bicep Curl", sets: 3, min: 8, max: 12, increment: 5, type: "load" }
    };

    const WORKOUTS = [
      {
        id: "bench",
        name: "Bench Day",
        icon: "ph-thin ph-barbell",
        blocks: [
          { label: "Main Lift", exercises: ["bench_press"] },
          { label: "Superset A", exercises: ["incline_db_press", "one_arm_db_row"] },
          { label: "Superset B", exercises: ["lateral_raise", "cable_tricep_pushdown"] }
        ]
      },
      {
        id: "squat",
        name: "Squat Day",
        icon: "ph-thin ph-person-simple-walk",
        blocks: [
          { label: "Main Lift", exercises: ["squat"] },
          { label: "Accessory Circuit", exercises: ["good_morning", "cable_crunch", "standing_calf_raise"] }
        ]
      },
      {
        id: "deadlift",
        name: "Deadlift Day",
        icon: "ph-thin ph-lightning",
        blocks: [
          { label: "Main Lift", exercises: ["deadlift"] },
          { label: "Superset A", exercises: ["pull_up", "band_face_pull"] },
          { label: "Superset B", exercises: ["db_shrug", "db_bicep_curl"] }
        ]
      }
    ];

    let state = loadState();
    let activeWorkoutId = null;

    function defaultState() {
      return { exercises: {} };
    }

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultState();
      } catch {
        return defaultState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getExerciseState(id) {
      const config = EXERCISES[id];
      if (!state.exercises[id]) {
        state.exercises[id] = {
          targetWeight: "",
          targetSetup: "",
          targetReps: Array(config.sets).fill(config.min),
          history: []
        };
      }
      return state.exercises[id];
    }

    function formatLoad(exerciseId, value, setup) {
      const config = EXERCISES[exerciseId];
      if (config.type === "setup") return setup || "choose setup";
      return value === "" || value === null || Number.isNaN(Number(value)) ? "choose weight" : `${value} lb`;
    }

    function formatReps(reps) {
      return reps.join(", ");
    }

    function lastWorkoutText(exerciseId) {
      const record = getExerciseState(exerciseId).history.at(-1);
      if (!record) return "Last time: no data yet";
      const load = EXERCISES[exerciseId].type === "setup" ? record.setup || "setup not noted" : `${record.weight} lb`;
      return `Last time: ${load} × ${formatReps(record.reps)}`;
    }

    function nextReps(reps, max) {
      const next = Math.min(Math.min(...reps) + 1, max);
      return reps.map(() => next);
    }

    function allAtMax(reps, max) {
      return reps.every(rep => rep >= max);
    }

    function applyDecision(exerciseId, log, decision) {
      const config = EXERCISES[exerciseId];
      const exState = getExerciseState(exerciseId);

      exState.history.push({
        date: new Date().toISOString(),
        weight: log.weight,
        setup: log.setup,
        reps: log.reps,
        decision
      });

      if (decision === "maintain") {
        exState.targetWeight = log.weight;
        exState.targetSetup = log.setup;
        return;
      }

      if (allAtMax(exState.targetReps, config.max)) {
        if (config.type === "load") {
          const currentWeight = Number(log.weight || exState.targetWeight || 0);
          exState.targetWeight = currentWeight ? currentWeight + config.increment : "";
        } else {
          exState.targetSetup = log.setup;
        }
        exState.targetReps = Array(config.sets).fill(config.min);
      } else {
        exState.targetWeight = log.weight;
        exState.targetSetup = log.setup;
        exState.targetReps = nextReps(exState.targetReps, config.max);
      }
    }

    function renderHome() {
      showScreen("homeScreen");
      const container = document.getElementById("workoutButtons");
      container.innerHTML = "";

      WORKOUTS.forEach(workout => {
        const btn = document.createElement("button");
        btn.className = "btn-icon";
        btn.innerHTML = `<i class="${workout.icon}"></i> ${workout.name}`;
        btn.onclick = () => startWorkout(workout.id);
        container.appendChild(btn);
      });
    }

    function startWorkout(workoutId) {
      activeWorkoutId = workoutId;
      renderWorkout();
    }

    function renderWorkout() {
      showScreen("workoutScreen");
      const workout = WORKOUTS.find(w => w.id === activeWorkoutId);
      const container = document.getElementById("workoutContent");
      container.innerHTML = `<div class="card"><h2><i class="${workout.icon}" style="vertical-align: middle; margin-right: 4px;"></i> ${workout.name}</h2><p class="muted">Log your actual sets, then choose what should happen next time.</p></div>`;

      workout.blocks.forEach(block => {
        const label = document.createElement("div");
        label.className = "block-label";
        label.textContent = block.label;
        container.appendChild(label);

        block.exercises.forEach(exerciseId => {
          container.appendChild(renderExerciseCard(exerciseId));
        });
      });
    }

    function renderExerciseCard(exerciseId) {
      const config = EXERCISES[exerciseId];
      const exState = getExerciseState(exerciseId);
      const card = document.createElement("div");
      card.className = "card exercise-card";
      card.dataset.exerciseId = exerciseId;

      const currentLoad = formatLoad(exerciseId, exState.targetWeight, exState.targetSetup);
      const inputLabel = config.type === "setup" ? config.setupLabel : "Weight";
      const inputType = config.type === "setup" ? "text" : "number";
      const inputStep = config.increment === 2.5 ? "2.5" : "5";

      card.innerHTML = `
        <h3 class="exercise-title"><i class="ph-thin ph-barbell"></i> ${config.name}</h3>
        <p class="last"><i class="ph-thin ph-clock-counter-clockwise" style="vertical-align: middle;"></i> ${lastWorkoutText(exerciseId)}</p>
        <p class="prescription"><i class="ph-thin ph-target" style="vertical-align: middle;"></i> Today: ${currentLoad} × ${formatReps(exState.targetReps)}</p>
        ${config.type === "setup" ? `<p class="note"><i class="ph-thin ph-info" style="vertical-align: middle;"></i> Use the setup field to track band, assistance, or difficulty. At the top of the range, make the setup harder manually.</p>` : ""}
        <div class="sets">
          ${Array.from({ length: config.sets }).map((_, index) => `
            <div class="set-row">
              <label>Set ${index + 1}</label>
              <input class="load-input" type="${inputType}" step="${inputStep}" placeholder="${inputLabel}" value="${config.type === "setup" ? exState.targetSetup : exState.targetWeight}" />
              <input class="rep-input" type="number" inputmode="numeric" min="0" placeholder="Reps" value="${exState.targetReps[index]}" />
            </div>
          `).join("")}
        </div>
        <div class="choice-row">
          <button class="secondary maintain-btn btn-icon"><i class="ph-thin ph-equals"></i> Maintain</button>
          <button class="move-up-btn btn-icon"><i class="ph-thin ph-trend-up"></i> Move Up</button>
        </div>
      `;

      card.querySelector(".maintain-btn").onclick = () => saveExercise(card, "maintain");
      card.querySelector(".move-up-btn").onclick = () => saveExercise(card, "move_up");
      return card;
    }

    function saveExercise(card, decision) {
      const exerciseId = card.dataset.exerciseId;
      const config = EXERCISES[exerciseId];
      const loadInputs = [...card.querySelectorAll(".load-input")];
      const repInputs = [...card.querySelectorAll(".rep-input")];
      const firstLoad = loadInputs[0].value.trim();

      const log = {
        weight: config.type === "load" ? Number(firstLoad || 0) : "",
        setup: config.type === "setup" ? firstLoad : "",
        reps: repInputs.map(input => Number(input.value || 0))
      };

      if (config.type === "load" && !log.weight) {
        alert("Enter a weight before saving this exercise.");
        return;
      }

      if (config.type === "setup" && !log.setup) {
        alert("Enter your band/setup before saving this exercise.");
        return;
      }

      applyDecision(exerciseId, log, decision);
      saveState();

      card.style.opacity = "0.65";
      card.querySelectorAll("button").forEach(btn => btn.disabled = true);
      const saved = document.createElement("div");
      saved.className = "saved-badge";
      saved.innerHTML = decision === "move_up" ? '<i class="ph-thin ph-check-circle"></i> Saved — moving up next time' : '<i class="ph-thin ph-check-circle"></i> Saved — maintaining prescription';
      card.appendChild(saved);

      // Auto-finish when every exercise card has been decided
      const allCards = document.querySelectorAll("#workoutContent .exercise-card");
      const allDone = [...allCards].every(c => c.style.opacity === "0.65");
      if (allDone) {
        setTimeout(finishWorkout, 600);
      }
    }

    function finishWorkout() {
      const workout = WORKOUTS.find(w => w.id === activeWorkoutId);
      const summary = document.getElementById("finishSummary");
      summary.innerHTML = "";

      workout.blocks.flatMap(b => b.exercises).forEach(exerciseId => {
        const config = EXERCISES[exerciseId];
        const exState = getExerciseState(exerciseId);
        const item = document.createElement("div");
        item.className = "summary-item";
        item.innerHTML = `
          <strong><i class="ph-thin ph-barbell" style="vertical-align: middle; margin-right: 4px;"></i> ${config.name}</strong>
          <p class="last"><i class="ph-thin ph-arrow-right" style="vertical-align: middle;"></i> Next: ${formatLoad(exerciseId, exState.targetWeight, exState.targetSetup)} × ${formatReps(exState.targetReps)}</p>
        `;
        summary.appendChild(item);
      });

      showScreen("finishScreen");
    }

    function showScreen(id) {
      ["homeScreen", "workoutScreen", "finishScreen"].forEach(screenId => {
        document.getElementById(screenId).classList.toggle("hidden", screenId !== id);
      });
    }

    document.getElementById("backBtn").onclick = renderHome;
    document.getElementById("homeBtn").onclick = renderHome;
    document.getElementById("resetDataBtn").onclick = () => {
      if (confirm("Reset all saved workout data on this device?")) {
        localStorage.removeItem(STORAGE_KEY);
        state = defaultState();
        renderHome();
      }
    };

    renderHome();
  </script>
</body>

</html>
